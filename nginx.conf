server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Retype emits directory-style URLs; try the path, then the .html, then the directory index.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Long-cache static assets; the HTML itself stays revalidated.
    location ~* \.(css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
